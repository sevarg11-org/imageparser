networks:
  default:
    name: imageparser
services:
  imageparser:
    # IMAGEPARSER_TAG selects the image: `latest` (main) or `pr-<number>` to validate a pull request.
    image: ghcr.io/sevarg11-org/imageparser:${IMAGEPARSER_TAG:-latest}
    pull_policy: always
    init: true
    ports:
      # IMAGEPARSER_PORT / *_DIR / PUID / PGID are compose substitution variables: set them in the
      # stack's .env file (Dockge: the ".env" editor), NOT under `environment:`.
      - ${IMAGEPARSER_PORT:-8080}:8080
    environment:
      # Startup fixes ownership of /config, then drops to this user before running the app.
      # TrueNAS SCALE's built-in "apps" user is 568:568. Match the photo dataset owner when different.
      PUID: ${PUID:-568}
      PGID: ${PGID:-568}
      # Optional HTTP Basic auth. Strongly recommended, because the UI can read the saved Immich API keys.
      # Leave empty when using OpenID Connect sign-in below; the two cannot be combined.
      IMAGEPARSER_USERNAME: ${IMAGEPARSER_USERNAME:-}
      IMAGEPARSER_PASSWORD: ${IMAGEPARSER_PASSWORD:-}
      # Optional OpenID Connect sign-in (for example Authentik), with per-user folders and Immich settings.
      # Setting OIDC_ISSUER_URL enables it; see "Single sign-on with Authentik" in README.md.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # The public callback URL registered with the provider, e.g. https://photos.example.com/auth/callback.
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email imageparser}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-imageparser-admin}
      OIDC_FOLDERS_CLAIM: ${OIDC_FOLDERS_CLAIM:-imageparser_folders}
      OIDC_SESSION_HOURS: ${OIDC_SESSION_HOURS:-8}
      # Only for an identity provider reachable over plain HTTP on a trusted network.
      OIDC_ALLOW_INSECURE_REQUESTS: ${OIDC_ALLOW_INSECURE_REQUESTS:-false}
      # Set to true to stream server-side logs (including immich-go diagnostics) to the browser's
      # developer console. Leave false in normal use; any signed-in user can read the stream.
      IMAGEPARSER_DEBUG: ${IMAGEPARSER_DEBUG:-false}
    volumes:
      # The photo share the browser can browse and edit, for example /mnt/tank/photos/scans.
      # Nothing outside this directory is reachable from the web UI.
      - ${IMAGEPARSER_PHOTOS_DIR:-./data}:/data
      # Saved Immich settings and the key that encrypts the API keys.
      - ${IMAGEPARSER_CONFIG_DIR:-./config}:/config
    restart: unless-stopped
