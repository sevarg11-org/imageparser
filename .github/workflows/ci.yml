name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    name: Build and publish PR Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Fork PRs get a read-only token, so their image is built but not pushed.
      PUSH_IMAGE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ env.PUSH_IMAGE == 'true' }}
          # pr-<number> always points at the newest commit on the PR; the sha tag pins one build.
          tags: |
            ghcr.io/${{ github.repository_owner }}/imageparser:pr-${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository_owner }}/imageparser:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

      - name: Summarize published image
        if: env.PUSH_IMAGE == 'true'
        run: |
          {
            echo "### Docker image for PR #${{ github.event.pull_request.number }}"
            echo
            echo "Set \`IMAGEPARSER_TAG=pr-${{ github.event.pull_request.number }}\` in the stack's \`.env\` to validate it, or pull:"
            echo
            echo '```'
            echo "docker pull ghcr.io/${{ github.repository_owner }}/imageparser:pr-${{ github.event.pull_request.number }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
